services:
  resumeiq-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resumeiq
      POSTGRES_USER: resumeiq_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - resumeiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeiq_user -d resumeiq"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  resumeiq-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: resumeiq-db
      DB_PORT: "5432"
      DB_NAME: resumeiq
      DB_USERNAME: resumeiq_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1/chat/completions
      OPENROUTER_MODEL: meta-llama/llama-3.3-70b-instruct
      APP_CORS_ALLOWEDORIGIN: https://3.104.215.198
      PORT: "8080"
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      resumeiq-db:
        condition: service_healthy
    restart: unless-stopped

  resumeiq-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /resumeiq
        VITE_BASE_PATH: /resumeiq/
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - resumeiq-backend
    restart: unless-stopped

volumes:
  resumeiq_postgres_data:
